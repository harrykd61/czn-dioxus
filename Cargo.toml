[package]
name = "czn-dioxus"
version = "0.1.0"
authors = ["d_in@rambler.ru <harrykd61>"]
edition = "2021"
description = "A Dioxus application for electronic signatures management"
license = "MIT"
repository = "https://github.com/yourusername/czn-dioxus"
homepage = "https://github.com/yourusername/czn-dioxus"
keywords = ["dioxus", "signatures", "certificates", "crypto"]
categories = ["gui", "cryptography"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0.17"
lazy_static = "1.5.0"
dioxus = { version = "0.7.3", features = ["desktop", "router"] }
reqwest = { version = "0.12.25", features = ["json"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Time",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }
chrono = { version = "0.4.42", features = ["clock", "serde", "std"] }
hex = "0.4.3"
encoding_rs = "0.8.35"
once_cell = "1.21.3"
widestring = "1.0"
aes-gcm = "0.10"
rand = "0.8"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
